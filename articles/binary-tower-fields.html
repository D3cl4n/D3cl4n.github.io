<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LaTeX in HTML with KaTeX</title>
    
    <!-- Include KaTeX CSS and JS -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <script defer src="https://jsdelivr.net"></script>
    
    <!-- Include KaTeX Auto-Render Extension (required to find delimiters automatically) -->
    <script defer src="https://jsdelivr.net"
        onload="renderMathInElement(document.body);"></script>
</head>
<body>

    <h1>Rendering LaTeX with KaTeX</h1>

    <!-- Inline Math (Uses \( ... \)) -->
    <p>Inline example: \( a^2 + b^2 = c^2 \)</p>

    <!-- Block/Display Math (Uses $$ ... $$ or \[ ... \]) -->
    <p>Block example:</p>
    $$ \int_{a}^{b} f(x) \, dx $$

</body>
</html>
