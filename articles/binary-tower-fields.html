<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LaTeX in HTML with MathJax</title>
    
    <!-- Include the MathJax Script via CDN -->
    <script src="https://polyfill.io"></script>
    <script id="MathJax-script" async src="https://jsdelivr.net"></script>
</head>
<body>

    <h1>Rendering LaTeX with MathJax</h1>

    <!-- 1. Inline Math (Uses \( ... \)) -->
    <p>This is an example of an inline equation: \( e^{i\pi} + 1 = 0 \), embedded directly in text.</p>

    <!-- 2. Block/Display Math (Uses $$ ... $$) -->
    <p>This is a block equation displayed on its own line:</p>
    $$ x = \frac{-b \pm \sqrt{b^2 - 4ac}}{2a} $$

</body>
</html>
